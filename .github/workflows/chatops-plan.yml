name: "ChatOps - Terraform Plan"

on:
  issue_comment:
    types: [created]

env:
  AWS_REGION: "us-east-2"
  TF_STATE_BUCKET: "blockchain-state-rawal29-2025"
  TF_WORKING_DIR: "./infrastructure"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    # C5: anchor trigger, restrict to repo members, never run on fork PRs
    if: |
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/tfplan') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest

    steps:
      # C5: refuse fork PRs — checking out fork code with AWS creds is RCE
      - name: Reject Fork PRs
        uses: actions/github-script@v6
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pr.data.head.repo.fork) {
              core.setFailed('Security: /tfplan is not permitted on fork PRs.');
            }

      - name: Get PR Branch
        uses: xt0rted/pull-request-comment-branch@v2
        id: branch

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.branch.outputs.head_sha }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python Dependencies
        run: pip install web3==7.3.0 python-dotenv==1.0.1

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan -out=tfplan.binary

      # H9: hash the normalized JSON plan, not the non-deterministic binary
      - name: Generate JSON Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Compute Plan Hash
        id: hash
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          PLAN_HASH=$(sha256sum tfplan.json | awk '{print $1}')
          echo "plan_hash=$PLAN_HASH" >> "$GITHUB_OUTPUT"
          echo "Plan hash: $PLAN_HASH"

      # C1/C2: register happens here at approval time, not at apply time
      - name: Blockchain Register
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: python scripts/tf_guard.py register ${{ env.TF_WORKING_DIR }}/tfplan.json

      # C6: content-addressed storage — plan keyed by hash, not mutable PR number
      - name: Upload Plan to S3
        run: |
          PLAN_HASH="${{ steps.hash.outputs.plan_hash }}"
          PR_NUM="${{ github.event.issue.number }}"
          aws s3 cp ${{ env.TF_WORKING_DIR }}/tfplan.json \
            "s3://${{ env.TF_STATE_BUCKET }}/plans/${PLAN_HASH}.json"
          aws s3 cp ${{ env.TF_WORKING_DIR }}/tfplan.binary \
            "s3://${{ env.TF_STATE_BUCKET }}/plans/${PLAN_HASH}.binary"
          # ref file maps PR → approved hash; may be updated by a new /tfplan run
          printf '%s' "${PLAN_HASH}" | \
            aws s3 cp - "s3://${{ env.TF_STATE_BUCKET }}/plans/pr-${PR_NUM}.ref"

      - name: Convert Plan to Text
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform show -no-color tfplan.binary > plan.txt

      - name: Post Plan to GitHub
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.TF_WORKING_DIR }}/plan.txt', 'utf8');
            const planHash = '${{ steps.hash.outputs.plan_hash }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### ✅ Terraform Plan Generated\n**Plan Hash (on-chain anchor):** \`${planHash}\`\n<details><summary>Show Plan</summary>\n\`\`\`hcl\n${plan.slice(0, 65000)}\n\`\`\`\n</details>`
            })
