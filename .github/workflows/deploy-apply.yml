name: "Deploy Infrastructure & Contracts"

on:
  push:
    branches:
      - main

env:
  AWS_REGION: "us-east-2"
  TF_STATE_BUCKET: "blockchain-state-rawal29-2025"
  TF_WORKING_DIR: "./infrastructure"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: "Apply & Publish"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: |
          npm install @openzeppelin/contracts@4.9.6
          pip install web3==7.3.0 py-solc-x==2.0.3 python-dotenv==1.0.1

      - name: Install Solc
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.20/solc-static-linux -O solc
          chmod +x solc
          sudo mv solc /usr/local/bin/

      # C10: only deploy contract when DEPLOY_ON_MERGE is explicitly set to 'true'
      # Default is 'false' to prevent re-deploying on every merge and orphaning history
      - name: Deploy Smart Contract (if needed)
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          DEPLOY_ON_MERGE: ${{ vars.DEPLOY_ON_MERGE || 'false' }}
        run: python scripts/deploy_contract.py

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Identify PR Number
        uses: actions/github-script@v6
        id: get-pr
        with:
          script: |
            const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            if (data.length === 0) {
              console.log("No PR found associated with this commit.");
              return "none";
            }
            console.log("Found PR #" + data[0].number);
            return data[0].number;
          result-encoding: string

      # C6: download content-addressed plan via the PR's approved hash reference
      - name: Download Approved Plan
        id: download-plan
        run: |
          PR_NUM="${{ steps.get-pr.outputs.result }}"
          if [ "$PR_NUM" == "none" ]; then
            echo "Skipping download (Direct Push detected)."
          else
            echo "Fetching approved plan hash for PR #${PR_NUM}"
            aws s3 cp "s3://${{ env.TF_STATE_BUCKET }}/plans/pr-${PR_NUM}.ref" /tmp/plan.ref
            PLAN_HASH=$(cat /tmp/plan.ref | tr -d '[:space:]')
            echo "plan_hash=$PLAN_HASH" >> "$GITHUB_OUTPUT"
            echo "Plan hash: $PLAN_HASH"
            aws s3 cp "s3://${{ env.TF_STATE_BUCKET }}/plans/${PLAN_HASH}.json" \
              "${{ env.TF_WORKING_DIR }}/tfplan.json"
            aws s3 cp "s3://${{ env.TF_STATE_BUCKET }}/plans/${PLAN_HASH}.binary" \
              "${{ env.TF_WORKING_DIR }}/tfplan.binary"
          fi

      - name: Enforce Security Gate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          if [ ! -f "tfplan.json" ] || [ ! -f "tfplan.binary" ]; then
            echo "CRITICAL SECURITY FAILURE: No authorized plan found!"
            echo "Reason: Could not find approved plan for PR ${{ steps.get-pr.outputs.result }} in S3."
            exit 1
          fi

      # C1: only verify here — registration happened at plan/approval time in chatops-plan.yml
      - name: Blockchain Verify
        env:
          ETHEREUM_RPC_URL: ${{ secrets.ETHEREUM_RPC_URL }}
          DEPLOYER_PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          CONTRACT_ADDRESS: ${{ secrets.CONTRACT_ADDRESS }}
        run: python scripts/tf_guard.py verify ${{ env.TF_WORKING_DIR }}/tfplan.json

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_ethereum_rpc_url: ${{ secrets.ETHEREUM_RPC_URL }}
          TF_VAR_deployer_private_key: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        run: terraform apply -auto-approve tfplan.binary

      - name: Publish Artifacts & Dashboard
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          RAW_ARTIFACT=$(terraform output -raw artifact_bucket_name)
          RAW_WEBSITE=$(terraform output -raw website_bucket_name)
          DASHBOARD_URL=$(terraform output -raw dashboard_url)
          ARTIFACT_BUCKET=$(echo "$RAW_ARTIFACT" | grep -o 'blockchain-artifacts-[0-9]*' | head -n 1)
          WEBSITE_BUCKET=$(echo "$RAW_WEBSITE" | grep -o 'auditor-dashboard-[0-9]*' | head -n 1)
          aws s3 cp ../BlockCICD_ABI.json s3://$ARTIFACT_BUCKET/contracts/BlockCICD_ABI.json
          CONTRACT_ADDR=$(grep 'contract_address' terraform.auto.tfvars | cut -d '"' -f 2)
          sed "s/REPLACE_ME_WITH_REAL_ADDRESS/$CONTRACT_ADDR/g" ../dashboard/index.html > index_final.html
          aws s3 cp index_final.html s3://$WEBSITE_BUCKET/index.html --content-type "text/html"
          echo "Dashboard Live at: http://$DASHBOARD_URL"
