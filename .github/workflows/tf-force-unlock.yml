name: "Terraform Force Unlock"

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: "Terraform lock ID to force-unlock"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  force-unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-2

      - name: Delete stale lock from DynamoDB directly
        run: |
          echo "Deleting lock item from DynamoDB..."
          aws dynamodb delete-item \
            --table-name terraform-state-lock \
            --key '{"LockID": {"S": "rawal-cicd-terraform-state-2026/prod/terraform.tfstate"}}' \
            --region us-east-2
          echo "Lock item deleted."

      - name: Setup Terraform (verify unlock)
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init + Verify
        working-directory: ./infrastructure
        run: |
          terraform init
          echo "State accessible:"
          terraform state list 2>&1 | head -20 || echo "(empty or new state)"
